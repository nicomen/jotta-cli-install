name: install matrix

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a key rotation or a broken Release file shows up on its own.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      host:
        description: 'Repository host to test'
        type: string
        default: 'https://repo.jotta.cloud'
      suite:
        description: 'Debian suite'
        type: choice
        default: debian
        options: [debian, unstable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JOTTA_HOST: ${{ inputs.host || 'https://repo.jotta.cloud' }}
  JOTTA_DEB_SUITE: ${{ inputs.suite || 'debian' }}
  JOTTA_RPM_PATH: /redhat

jobs:
  keys:
    name: keys and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Audit signing keys on every published host
        id: audit
        run: |
          mkdir -p results/keys
          JOTTA_RESULTS="$PWD/results/keys/results.tsv" scripts/check-keys.sh

      - name: Report
        if: always()
        run: scripts/report.sh "Signing keys and repository metadata" results/keys/results.tsv || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-keys
          path: results/

  aur:
    name: AUR package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, install and run the AUR package
        run: |
          mkdir -p results/aur
          JOTTA_RESULTS="$PWD/results/aur/results.tsv" scripts/test-install-aur.sh

      - name: Report
        if: always()
        run: scripts/report.sh "AUR package (jotta-cli)" results/aur/results.tsv || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-aur
          path: results/
          if-no-files-found: warn

  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Select targets
        id: build
        run: |
          set -euo pipefail
          matrix="$(jq -c '.targets' matrix.json)"
          echo "matrix=$matrix"          >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "- \(.name)  [\(.image) \(.platform)]"' <<<"$matrix" \
            >> "$GITHUB_STEP_SUMMARY"

  install:
    name: ${{ matrix.target.name }}
    needs: plan
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: ${{ matrix.target.qemu && 60 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure podman with a fresh vfs storage backend
        if: matrix.target.podman_vfs
        # Docker (on any storage driver -- overlay2 *and* vfs both verified
        # to still fail) and podman's own default overlay storage all hit a
        # real bug: apt/dpkg's "securely remove" cleanup of its per-package
        # /var/lib/dpkg/tmp.ci scratch dir breaks under armhf QEMU emulation
        # on an overlay-based backing store ("rm command for cleanup
        # subprocess failed ... Directory not empty" / "unable to securely
        # remove"). Reproduces 100% of the time with plain `apt-get install
        # curl` on this image/platform, no jotta package involved. Rootless
        # podman on a fresh vfs graphroot avoids it. run-target.sh always
        # performs the actual qemu binfmt registration via docker (root),
        # regardless of which engine runs the leg -- a rootless podman
        # container doing that registration itself was found to leave the
        # handler unusable for later rootless execs on the same host.
        run: |
          command -v podman >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq podman; }
          mkdir -p /tmp/podman-vfs-graphroot
          cat > /tmp/podman-vfs-storage.conf <<'EOF'
          [storage]
          driver = "vfs"
          graphroot = "/tmp/podman-vfs-graphroot"
          EOF
          driver="$(CONTAINERS_STORAGE_CONF=/tmp/podman-vfs-storage.conf podman info --format '{{.Store.GraphDriverName}}')"
          echo "podman storage driver: $driver"
          [ "$driver" = vfs ] || { echo "::error::podman did not switch to the vfs storage driver (got: $driver)"; exit 1; }

      - name: Install and verify jotta-cli
        env:
          IMAGE: ${{ matrix.target.image }}
          PLATFORM: ${{ matrix.target.platform }}
          NEEDS_QEMU: ${{ matrix.target.qemu && '1' || '0' }}
          OUTDIR: ${{ github.workspace }}/results/${{ matrix.target.id }}
          CONTAINER_RUNTIME: ${{ matrix.target.podman_vfs && 'podman' || 'docker' }}
          CONTAINERS_STORAGE_CONF: ${{ matrix.target.podman_vfs && '/tmp/podman-vfs-storage.conf' || '' }}
          # TEMPORARY, scoped to this one leg only: testing whether the
          # tmp.ci dpkg bug is actually OpenSSL hitting an unemulated CPU
          # feature under qemu-arm. Remove once confirmed or ruled out --
          # OPENSSL_CONF=/dev/null could affect other checks on this leg
          # (e.g. TLS to the repo), which is why it's this narrowly scoped.
          OPENSSL_ia32cap: ${{ matrix.target.podman_vfs && '~0x200000200000000' || '' }}
          OPENSSL_CONF: ${{ matrix.target.podman_vfs && '/dev/null' || '' }}
          # Per-target overrides for the two "jotta-cli unstable channel" legs
          # -- jotta's own pre-release package build, a separate axis from
          # which OS is running it. Every other leg falls back to the
          # job-level default (jotta's normal, stable channel).
          JOTTA_DEB_SUITE: ${{ matrix.target.deb_suite || env.JOTTA_DEB_SUITE }}
          JOTTA_RPM_PATH: ${{ matrix.target.rpm_path || env.JOTTA_RPM_PATH }}
        run: scripts/run-target.sh

      - name: Report
        if: always()
        run: |
          scripts/report.sh "${{ matrix.target.name }}" \
            "results/${{ matrix.target.id }}/results.tsv" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.target.id }}
          path: results/
          if-no-files-found: warn

  summary:
    name: summary
    needs: [keys, install, aur]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only used to commit the status grid back to main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Status grid
        run: |
          {
            echo "## jotta-cli install matrix"
            echo ""
            echo "Host: \`$JOTTA_HOST\` · suite: \`$JOTTA_DEB_SUITE\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/report.sh --grid results || true
          scripts/report.sh --failures results || true

      - name: Per-leg detail
        if: always()
        run: scripts/report.sh --all results || true

      # The README carries the same grid so the repository front page shows the
      # last known state without opening a run. Only main and the nightly cron
      # write it back; pull requests just render to the job summary above.
      - name: Update README status grid
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          scripts/update-readme.sh results README.md
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "ci: update install matrix status grid [skip ci]"
          git push origin HEAD:main
